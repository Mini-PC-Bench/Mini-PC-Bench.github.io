name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build changelog
        shell: pwsh
        run: ./build-changelog.ps1

      - name: Verify devices.json is valid JSON
        run: python3 -m json.tool devices.json > /dev/null

      - name: Verify device-links.json is valid JSON
        run: python3 -m json.tool device-links.json > /dev/null

      - name: Stage public site
        shell: bash
        run: |
          mkdir _site
          while IFS= read -r path; do
            path="${path%$'\r'}"
            test -e "$path"
            /usr/bin/cp -R --parents "$path" _site
          done < publish-files.txt

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Run Playwright E2E tests
        run: SITE_DIR="$GITHUB_WORKSPACE/_site" docker compose up --build --abort-on-container-exit --exit-code-from e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  deploy:
    needs: e2e
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download tested site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
